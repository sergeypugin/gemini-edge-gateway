name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript and run tests
        run: npm run validate

      - name: Inject D1 Database binding from Secret
        env:
          GATEWAY_D1_ID: ${{ secrets.GATEWAY_D1_ID }}
        run: |
          if [ -n "$GATEWAY_D1_ID" ]; then
            node -e '
              const fs = require("fs");
              const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
              config.d1_databases = [{
                binding: "DB",
                database_name: "gemini-gateway-db",
                database_id: process.env.GATEWAY_D1_ID,
                migrations_dir: "db/migrations"
              }];
              fs.writeFileSync("wrangler.jsonc", JSON.stringify(config, null, 2));
            '
          fi

      - name: Apply D1 baseline schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_D1_ID: ${{ secrets.GATEWAY_D1_ID }}
        run: |
          if [ -n "$GATEWAY_D1_ID" ]; then
            npx wrangler d1 execute gemini-gateway-db --remote --file=db/schema.sql --yes
          fi

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_D1_ID: ${{ secrets.GATEWAY_D1_ID }}
        run: |
          if [ -n "$GATEWAY_D1_ID" ]; then
            npx wrangler d1 migrations apply gemini-gateway-db --remote
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy | grep -v -E "workers\.dev|https://"
